<!DOCTYPE html>
<html lang="ms" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Misi Kod Galaktik: Asas Sains Komputer Tingkatan 1</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tone.js CDN for Audio Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #030712;
            color: #f3f4f6;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            width: 100%;
        }

        .space-font {
            font-family: 'Orbitron', sans-serif;
        }

        /* Animated Starry Space Background */
        .stars-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: #030712;
            background-image: 
                radial-gradient(1.5px 1.5px at 25px 35px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 80px, #38bdf8, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 90px 140px, #a855f7, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 150px 60px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 200px 180px, #38bdf8, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 240px 240px;
            animation: moveStars 12s infinite linear;
            pointer-events: none;
        }

        @keyframes moveStars {
            0% { transform: translateY(0); }
            100% { transform: translateY(240px); }
        }

        /* Strict screen visibility rules ensuring hidden screens never absorb clicks */
        .hidden-screen {
            display: none !important;
            pointer-events: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
        }

        /* Custom scrollbar for inner scrollable modals */
        .touch-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .touch-scroll::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
        }
        .touch-scroll::-webkit-scrollbar-thumb {
            background: rgba(59, 130, 246, 0.6);
            border-radius: 8px;
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(59, 130, 246, 0.25);
        }

        /* Canvas interaction rule */
        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* Print formatting for Sijil Pencapaian */
        @media print {
            body {
                background: white !important;
                color: black !important;
            }
            .stars-bg, #game-screen, #mobile-controls, .no-print {
                display: none !important;
            }
            #end-screen {
                position: static !important;
                display: block !important;
                background: white !important;
                color: black !important;
                padding: 0 !important;
            }
            .glass-card {
                background: white !important;
                color: black !important;
                border: 2px solid #000 !important;
                box-shadow: none !important;
            }
            textarea, input {
                border: 1px solid #000 !important;
                color: black !important;
                background: white !important;
            }
        }
    </style>
